# webserv configuration
#
# The syntax follows nginx closely enough to be familiar: directives end with a
# semicolon, blocks are delimited by braces, and whitespace is insignificant.
# Comments run from '#' to the end of the line.

server {
	listen              localhost:8080;
	server_name         localhost;
	root                ./www;
	index               index.html;

	# Bodies larger than this are refused with 413 while they stream in,
	# rather than after the whole upload has been buffered.
	client_max_body_size 10485760;

	# One page per status the server can actually produce. Each is a real file
	# under ./www/errors, so the site's own look survives a failure instead of
	# dropping to the built-in plain-text body.
	error_page 400 /errors/400.html;
	error_page 403 /errors/403.html;
	error_page 404 /errors/404.html;
	error_page 405 /errors/405.html;
	error_page 408 /errors/408.html;
	error_page 411 /errors/411.html;
	error_page 413 /errors/413.html;
	error_page 414 /errors/414.html;
	error_page 415 /errors/415.html;
	error_page 431 /errors/431.html;
	error_page 500 /errors/500.html;
	error_page 501 /errors/501.html;
	error_page 502 /errors/502.html;
	error_page 503 /errors/503.html;
	error_page 504 /errors/504.html;
	error_page 505 /errors/505.html;

	location / {
		allow_methods   GET HEAD;
		root            ./www;
		index           index.html;
	}

	# A browsable directory: with no index file, autoindex renders a listing.
	location /files/ {
		allow_methods   GET HEAD;
		root            ./www;
		autoindex       on;
	}

	# alias replaces the matched prefix instead of appending to the root, so
	# /docs/readme.html resolves to ./www/documents/readme.html.
	location /docs/ {
		allow_methods   GET HEAD;
		alias           ./www/documents;
		autoindex       on;
	}

	location /uploads/ {
		allow_methods   GET HEAD POST DELETE;
		root            ./www;
		upload_store    ./www/uploads;
		autoindex       on;
		client_max_body_size 5242880;
	}

	location /cgi-bin/ {
		allow_methods   GET POST;
		root            ./www;
		cgi_extension   .py;
		cgi_interpreter /usr/bin/python3;
	}

	# A second interpreter is a second location. The site's fortune cookie was a
	# PHP script in the original; it is Python now so that the demo does not
	# depend on php-cgi being installed, but nothing about the server cares which
	# binary it execs. Drop php-cgi in and uncomment this.
	#
	# location /php-bin/ {
	#	allow_methods   GET POST;
	#	root            ./www;
	#	cgi_extension   .php;
	#	cgi_interpreter /usr/bin/php-cgi;
	# }

	location /old-page {
		allow_methods   GET HEAD;
		return          301 /;
	}
}

# A second server on its own port, to demonstrate that one process serves
# several independent endpoints from a single event loop.
server {
	listen              localhost:8081;
	server_name         second;
	root                ./www2;
	index               index.html;
	client_max_body_size 1048576;

	error_page 404 /errors/404.html;

	location / {
		allow_methods   GET HEAD;
		root            ./www2;
		index           index.html;
	}

	# A location may point outside its server's root. This one lends the other
	# site's stylesheet to this one rather than keeping a second copy of it: the
	# root here replaces the server root for anything matching /assets/.
	location /assets/ {
		allow_methods   GET HEAD;
		root            ./www;
	}
}

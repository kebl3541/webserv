# webserv configuration
#
# The syntax follows nginx closely enough to be familiar: directives end with a
# semicolon, blocks are delimited by braces, and whitespace is insignificant.
# Comments run from '#' to the end of the line.

server {
	listen              localhost:8080;
	server_name         localhost;
	root                ./www;
	index               index.html;

	# Bodies larger than this are refused with 413 while they stream in,
	# rather than after the whole upload has been buffered.
	client_max_body_size 10485760;

	error_page 404 /errors/404.html;
	error_page 403 /errors/403.html;
	error_page 500 502 503 504 /errors/50x.html;

	location / {
		allow_methods   GET HEAD;
		root            ./www;
		index           index.html;
	}

	# A browsable directory: with no index file, autoindex renders a listing.
	location /files/ {
		allow_methods   GET HEAD;
		root            ./www;
		autoindex       on;
	}

	# alias replaces the matched prefix instead of appending to the root, so
	# /docs/readme.html resolves to ./www/documents/readme.html.
	location /docs/ {
		allow_methods   GET HEAD;
		alias           ./www/documents;
		autoindex       on;
	}

	location /uploads/ {
		allow_methods   GET HEAD POST DELETE;
		root            ./www;
		upload_store    ./www/uploads;
		autoindex       on;
		client_max_body_size 5242880;
	}

	location /cgi-bin/ {
		allow_methods   GET POST;
		root            ./www;
		cgi_extension   .py;
		cgi_interpreter /usr/bin/python3;
	}

	location /old-page {
		allow_methods   GET HEAD;
		return          301 /;
	}
}

# A second server on its own port, to demonstrate that one process serves
# several independent endpoints from a single event loop.
server {
	listen              localhost:8081;
	server_name         second;
	root                ./www2;
	index               index.html;
	client_max_body_size 1048576;

	error_page 404 /errors/404.html;

	location / {
		allow_methods   GET HEAD;
		root            ./www2;
		index           index.html;
	}
}

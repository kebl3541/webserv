<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alias example</title>
<style>body{background:#0f1115;color:#e6e8eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:3rem 1.5rem}main{max-width:40rem;margin:0 auto}a{color:#7aa2f7;text-decoration:none}code{font-family:ui-monospace,Menlo,monospace;color:#9ece6a}</style>
</head><body><main>
<h1>Served through an alias</h1>
<p>The request was for <code>/docs/readme.html</code>. The location block uses
<code>alias ./www/documents</code>, so the matched prefix was replaced rather
than appended, and this file came from <code>./www/documents/readme.html</code>.</p>
<p><a href="/">back to the index</a></p>
</main></body></html>

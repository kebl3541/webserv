<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webserv - Red 3D Stack</title>
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="/favicon.ico">
</head>
<body>

<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>

<h1>Webserv</h1>

<main class="container" id="content">

	<p class="tagline">Here to serve.</p>

	<div class="zone">
		<h2>Static Upload</h2>
		<a href="/upload/">Go to Static Upload</a>
	</div>

	<div class="zone">
		<h2>Dynamic Upload</h2>
		<form action="/cgi-bin/upload.py" method="post" enctype="multipart/form-data"
		      class="upload-form" id="upload-form">
			<div class="custom-file-input">
				<input type="file" name="file" id="file-input" required>
				<label for="file-input">Choose File</label>
			</div>
			<input type="submit" value="Upload File">
		</form>
		<p class="status" id="upload-status" role="status" aria-live="polite"></p>
	</div>

	<div class="zone" id="fortune-zone">
		<h2>Fortune Cookie</h2>
		<a href="/cgi-bin/fortune.py" class="fortune-link">Get Your Fortune</a>
	</div>

	<div class="zone">
		<h2>Download Zone</h2>
		<a href="/downloads/">See the Goodies</a>
	</div>

	<div class="zone">
		<h2>Delete Zone</h2>
		<a href="/delete/">Zap Something</a>
	</div>

	<div class="zone">
		<h2>Cookies</h2>
		<a href="/cookies/">Manage Cookies</a>
	</div>

	<div class="zone">
		<h2>Under the Hood</h2>
		<a href="/tour/">Take the Tour</a>
	</div>

	<div class="zone">
		<h2>About Us</h2>
		<a href="/about/">About Us</a>
	</div>

</main>

<script>
// The original version of this handler had to dig the JSON out of the response
// by hand: it searched the body for a blank line and sliced off everything
// before it, because the old server copied the script's CGI headers into the
// body and then sent its own on top. The headers are consumed and merged now,
// so the body is the body and response.json() is enough.
document.addEventListener('DOMContentLoaded', function () {
	var form = document.getElementById('upload-form');
	var status = document.getElementById('upload-status');
	if (!form) return;

	function say(text, bad) {
		status.textContent = text;
		status.classList.add('visible');
		status.classList.toggle('bad', !!bad);
	}

	form.addEventListener('submit', function (event) {
		event.preventDefault();

		var input = document.getElementById('file-input');
		if (!input.files.length) {
			say('Pick a file first.', true);
			return;
		}

		say('Uploading...');

		fetch(form.action, { method: 'POST', body: new FormData(form) })
			.then(function (response) {
				var type = response.headers.get('Content-Type') || '';
				if (type.indexOf('application/json') === -1)
					return response.text().then(function (text) {
						throw new Error('Server said ' + response.status + ': ' + text.slice(0, 200));
					});
				return response.json().then(function (data) {
					return { ok: response.ok, data: data };
				});
			})
			.then(function (result) {
				say(result.data.message, !result.ok);
				if (result.ok) form.reset();
			})
			.catch(function (error) {
				say(error.message || 'Upload Failed, Try Again!', true);
			});
	});
});
</script>

</body>
</html>

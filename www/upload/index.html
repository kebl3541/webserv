<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Jam - Webserv</title>
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="/favicon.ico">
</head>
<body>

<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>
<div class="bg-anim" aria-hidden="true"></div>

<h1>Upload Jam</h1>

<main class="container">

	<div class="zone wide">
		<h2>Blast a File In</h2>
		<form action="/uploads/" method="POST" enctype="multipart/form-data" class="upload-form">
			<div class="custom-file-input">
				<input type="file" name="file" id="file" required>
				<label for="file">Choose File</label>
			</div>
			<button type="submit">Blast It!</button>
		</form>
	</div>

	<div class="zone wide">
		<h2>Where It Lands</h2>
		<a href="/uploads/">Open /uploads/</a>
		<a href="/downloads/">Download Zone</a>
	</div>

	<div class="zone">
		<h2>Back to the Beat</h2>
		<a href="/">HIT THE FLOOR</a>
	</div>

</main>

</body>
</html>
